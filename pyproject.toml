[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mfs"
version = "0.1.0"
description = "An embedded document and chunk search library"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "blake3==1.0.9",
  "filelock==3.32.5",
  "google-re2==1.1.20251105",
  "milvus-lite==3.2.1",
  "pymilvus==3.0.1",
  "pymupdf4llm==1.28.2",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mfs"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["conformance: executable Milvus Lite backend conformance checks"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
